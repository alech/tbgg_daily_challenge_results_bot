[project]
name = "tbgg-bot"
version = "0.1.0"
description = "Posts the TBGG GeoGuessr club daily-challenge team result to Discord once a day."
requires-python = ">=3.13"
dependencies = ["py-cord>=2.8.1"]

[dependency-groups]
dev = ["boto3>=1.35", "boto3-stubs[secretsmanager]>=1.35", "mypy>=1.13", "pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tbgg_bot"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Vendored dependencies staged for the Lambda bundle are not ours to lint.
extend-exclude = ["infra/cdk.out", "infra/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C90", "ANN", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["tbgg_bot", "conftest"]

[tool.ruff.lint.per-file-ignores]
# ANN401: test doubles stand in for urlopen, whose signature is genuinely untyped.
# N818: the fake boto3 exception must keep boto3's exact class name, which the code matches on.
"tests/*" = ["ANN401", "N818"]
# The SsmClient Protocol mirrors boto3's PascalCase keyword arguments verbatim; renaming them
# would stop the Protocol matching the real client.
"src/tbgg_bot/credentials.py" = ["N803"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["tbgg_bot"]

[[tool.mypy.overrides]]
module = "discord.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
